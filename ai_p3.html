<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>마인드파일 AI - 연관 맵</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#4f46e5",
            "secondary": "#10b981",
            "on-surface": "#0f172a"
          },
          spacing: {
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-md": "0.75rem",
            "space-lg": "1rem",
            "margin": "1rem"
          }
        }
      }
    };
  </script>
  <style>
    @layer base {
      html, body { width: 100%; margin: 0; padding: 0; background-color: #ffffff; }
      body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    }
    ::-webkit-scrollbar { display: none; }
    body { min-height: max(884px, 100dvh); }
  </style>
</head>
<body class="bg-[#ffffff] text-on-surface flex flex-col min-h-screen">
  <!-- Header -->
  <header class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-xl pt-safe border-b border-slate-100">
    <div class="h-16 px-space-lg flex items-center justify-between gap-space-sm">
      <div class="flex items-center gap-space-sm min-w-0">
        <img alt="MindFile AI Logo" class="h-8 w-auto object-contain flex-shrink-0" src="https://lh3.googleusercontent.com/aida/AEtjO1Ugh9zqHGV4gc95ackOK-1pET4xX6egnykq-41Ygz08yQZc2nY1DLuQdEUXABY5Ywv02ehhZZNsQ8N03MgbGoXZz7_L969vjzbgJuYf23_qLBwR5ydAh-cCiq07m5eWM3K_deuKjjsvohoBlk2qxWTJHSwuCYDkLxvaUY-tnTmvNxhXFgU8msr7xPAeOZ3QPbMV9-Fb6UReDSeSBooY_MnPrgEC1Xq4UWZhzQ581131vfPc2Pmz96lZ7A"/>
        <div class="flex flex-col min-w-0">
          <div class="flex items-center gap-space-xs">
            <span class="font-bold text-slate-900 tracking-tight text-base">마인드파일 AI</span>
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-600 font-bold text-[11px]">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>Live
            </span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-1.5 flex-shrink-0">
        <button aria-label="알림" class="w-10 h-10 flex items-center justify-center rounded-full text-slate-600 hover:bg-slate-100 transition-colors relative">
          <span class="material-symbols-outlined text-[22px]">notifications</span>
          <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-rose-500"></span>
        </button>
        <div class="w-10 h-10 flex items-center justify-center">
          <img alt="Profile" class="w-8 h-8 rounded-full object-cover ring-2 ring-indigo-500/20 shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB2fKPpBiLOTHophlqNs-9g5lMLRspKtjald1LKEcO1DshhtvBs0GbncR413V23mPn8lLUd1uYoJRikVQEkp-WnDLrrPSD01Eus8mdUF4QOcyZFNM-JZfoUZtAtLSJx9UydEy7IJcji8uQtFvFTz8HcUlJgOh5wT-H0vqPZlB1eGV1Q2N_yejee0z_NYXhtfEhULrMGXCZI5-8ecgNPB3zYoXUJcOhg2JW63i0hhFet5POILXXHaHfM"/>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col relative w-full pt-16 pb-28 bg-[#fafbff]">
    <div class="flex flex-col w-full px-margin pb-space-2xl gap-3">
      <!-- 상단 뷰 스위처 -->
      <div class="pt-3 flex items-center justify-between bg-slate-100 p-1 rounded-full">
        <button class="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-full bg-white text-indigo-600 shadow-sm font-bold text-xs transition-all">
          <span class="material-symbols-outlined text-[17px]" style="font-variation-settings: 'FILL' 1;">hub</span>
          <span>연관 마인드맵</span>
        </button>
        <button class="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-full text-slate-500 hover:text-slate-800 font-semibold text-xs transition-colors">
          <span class="material-symbols-outlined text-[17px]">view_kanban</span>
          <span>클러스터보드</span>
        </button>
        <button class="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-full text-slate-500 hover:text-slate-800 font-semibold text-xs transition-colors">
          <span class="material-symbols-outlined text-[17px]">timeline</span>
          <span>타임라인</span>
        </button>
      </div>

      <!-- 1. 가시적 공간 확보 대시보드 -->
      <section class="flex flex-col bg-white rounded-2xl p-4 shadow-[0_4px_24px_rgba(15,23,42,0.06)] border border-slate-100/90">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="w-8 h-8 rounded-xl bg-emerald-500/10 text-emerald-600 flex items-center justify-center">
              <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">cloud_sync</span>
            </span>
            <span class="font-bold text-slate-900 tracking-tight text-base">가시적 공간 확보</span>
          </div>
          <span class="inline-flex items-center gap-1 text-[11px] font-bold text-emerald-700 bg-emerald-100/70 border border-emerald-300/60 px-2.5 py-1 rounded-full animate-pulse shadow-sm">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> +5.4 GB 즉시 회수 가능
          </span>
        </div>
        <div class="flex items-center justify-between gap-3 my-3">
          <div class="relative w-28 h-28 flex-shrink-0 flex items-center justify-center">
            <svg class="w-full h-full -rotate-90 transform" viewBox="0 0 100 100">
              <circle cx="50" cy="50" fill="none" r="40" stroke="#f1f5f9" stroke-width="9"></circle>
              <circle cx="50" cy="50" fill="none" r="40" stroke="#10b981" stroke-dasharray="206 251.2" stroke-dashoffset="0" stroke-linecap="round" stroke-width="9.5"></circle>
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
              <span class="text-[10px] font-bold text-slate-400">쾌적도</span>
              <span class="text-xl font-black text-slate-900 tracking-tight">82<span class="text-xs text-emerald-600 font-extrabold">%</span></span>
              <span class="text-[9px] font-semibold text-emerald-600 bg-emerald-50 px-1 rounded">목표 달성</span>
            </div>
          </div>
          <div class="flex flex-col justify-center flex-1 gap-1.5 min-w-0">
            <div class="grid grid-cols-2 gap-1.5">
              <div class="bg-indigo-50/70 p-2 rounded-xl border border-indigo-100/80 flex flex-col">
                <span class="text-[10px] font-medium text-slate-500">현재 사용량</span>
                <span class="text-sm font-extrabold text-indigo-950">14.2 GB</span>
              </div>
              <div class="bg-emerald-50/80 p-2 rounded-xl border border-emerald-200/80 flex flex-col">
                <span class="text-[10px] font-bold text-emerald-700">정리 후 잔여</span>
                <span class="text-sm font-black text-emerald-600">8.8 GB</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 2. 인터랙티브 마인드맵 캔버스 -->
      <section class="relative w-full rounded-2xl bg-white border border-slate-200/80 shadow-[0_4px_24px_rgba(15,23,42,0.05)] overflow-hidden min-h-[460px] flex items-center justify-center select-none" style="background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px); background-size: 18px 18px;">
        <!-- 중앙 메인 노드 -->
        <div class="relative z-30 flex flex-col items-center justify-center p-4 rounded-2xl bg-gradient-to-br from-indigo-600 via-indigo-700 to-violet-700 text-white shadow-[0_12px_32px_rgba(79,70,229,0.38)] active:scale-95 transition-transform cursor-pointer">
          <div class="w-12 h-12 rounded-xl bg-white/20 backdrop-blur-md flex items-center justify-center mb-1.5 shadow-inner">
            <span class="material-symbols-outlined text-[28px] text-white" style="font-variation-settings: 'FILL' 1;">devices</span>
          </div>
          <span class="font-extrabold text-sm tracking-tight text-white">스마트폰 허브</span>
          <div class="flex items-center gap-1 mt-1">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            <span class="text-[11px] font-semibold text-indigo-100">총 2,410개 분석</span>
          </div>
        </div>

        <!-- 줌 인/아웃 컨트롤러 -->
        <div class="absolute bottom-3 right-3 z-30 flex items-center gap-1 bg-white/95 backdrop-blur-md p-1.5 rounded-full shadow-[0_4px_16px_rgba(15,23,42,0.1)] border border-slate-200">
          <button aria-label="확대" class="w-7 h-7 rounded-full flex items-center justify-center text-slate-700 hover:bg-slate-100 transition-colors">
            <span class="material-symbols-outlined text-[18px]">add</span>
          </button>
          <button aria-label="축소" class="w-7 h-7 rounded-full flex items-center justify-center text-slate-700 hover:bg-slate-100 transition-colors">
            <span class="material-symbols-outlined text-[18px]">remove</span>
          </button>
          <button aria-label="맞춤" class="w-7 h-7 rounded-full flex items-center justify-center text-indigo-600 hover:bg-indigo-50 transition-colors">
            <span class="material-symbols-outlined text-[18px]">center_focus_strong</span>
          </button>
        </div>
      </section>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 w-full z-50 pb-safe bg-white/95 backdrop-blur-xl border-t border-slate-100 shadow-[0_-4px_20px_rgba(15,23,42,0.04)]">
    <div class="flex justify-around items-center h-16 px-space-xs">
      <a class="flex flex-col items-center justify-center gap-1 min-w-[44px] min-h-[44px] px-space-xs py-1 text-slate-400 hover:text-slate-700 transition-colors" href="p1.html">
        <span class="material-symbols-outlined text-[24px]">auto_awesome_mosaic</span>
        <span class="text-[11px]">홈</span>
      </a>
      <a class="flex flex-col items-center justify-center gap-1 min-w-[44px] min-h-[44px] px-space-xs py-1 text-slate-400 hover:text-slate-700 transition-colors" href="p2.html">
        <span class="material-symbols-outlined text-[24px]">folder_supervised</span>
        <span class="text-[11px]">스마트분류</span>
      </a>
      <a class="flex flex-col items-center justify-center gap-1 min-w-[44px] min-h-[44px] px-space-xs py-1 transition-colors text-indigo-600 font-bold" href="p3.html">
        <span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">hub</span>
        <span class="text-[11px]">연관 맵</span>
      </a>
      <a class="flex flex-col items-center justify-center gap-1 min-w-[44px] min-h-[44px] px-space-xs py-1 text-slate-400 hover:text-slate-700 transition-colors" href="p6.html">
        <span class="material-symbols-outlined text-[24px]">dashboard_customize</span>
        <span class="text-[11px]">맞춤배치</span>
      </a>
    </div>
  </nav>
</body>
</html>
